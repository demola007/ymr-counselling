name: ymr-counselling

services:
  web:
    build: { context: ., target: dev }
    ports: ["8080:8080"]
    environment:
      VITE_API_MODE: ${VITE_API_MODE:-mock}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ymr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ymr-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-ymr_counselling}
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Production-like static build: docker compose --profile prod up web-prod
  web-prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
      args:
        VITE_API_MODE: ${VITE_API_MODE:-mock}
        VITE_API_URL: ${VITE_API_URL:-}
    ports: ["8081:80"]

volumes:
  pgdata:
  web_node_modules:
